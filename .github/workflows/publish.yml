{
  "name": "Publish synthetic package",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "packages": "write"
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}",
            "FIXTURE_REPO": "rennerdo30/repo-reborn-test-pkg-7a85066df3"
          },
          "run": "python3 - <<'PY'\n\"\"\"Small OCI Distribution client. Credentials never enter argv, archives or logs.\"\"\"\nimport base64\nimport hashlib\nimport http.client\nimport json\nfrom pathlib import Path\nimport re\nimport subprocess\nimport time\nfrom concurrent.futures import ThreadPoolExecutor\nfrom urllib.error import HTTPError, URLError\nfrom urllib.parse import urlencode, urljoin, urlsplit, quote\nfrom urllib.request import Request, build_opener, HTTPRedirectHandler\n\nclass MetadataError(RuntimeError):pass\nclass storage:\n    CHUNK=65536\n\nMANIFESTS=('application/vnd.oci.image.index.v1+json',\n           'application/vnd.oci.image.manifest.v1+json',\n           'application/vnd.docker.distribution.manifest.list.v2+json',\n           'application/vnd.docker.distribution.manifest.v2+json',\n           'application/vnd.oci.artifact.manifest.v1+json')\nMAX_MANIFEST=16*1024**2\nDIGEST=re.compile(r'sha256:[a-f0-9]{64}\\Z')\nNAME=re.compile(r'[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*(?:/[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*)*\\Z')\nTAG=re.compile(r'[\\w][\\w.-]{0,127}\\Z',re.ASCII)\n\n\nclass RegistryError(MetadataError):\n    def __init__(self,status):\n        self.status=status\n        super().__init__('Container registry request failed (HTTP '+str(status)+'); credentials and signed URLs withheld')\n\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self,*args,**kwargs):return None\n\n\ndef digest(data):return 'sha256:'+hashlib.sha256(data).hexdigest()\n\n\ndef checked_digest(value):\n    if not isinstance(value,str) or not DIGEST.fullmatch(value):raise MetadataError('Unsupported container digest')\n    return value\n\n\ndef blob_path(root,value):return Path(root)/'blobs'/'sha256'/checked_digest(value)[7:]\n\n\ndef gh_credentials():\n    p=subprocess.run(['gh','auth','token','--hostname','github.com'],capture_output=True)\n    if p.returncode or not p.stdout.strip():raise MetadataError('Existing gh login is required for registry authentication')\n    return p.stdout.decode().strip()\n\n\nclass Registry:\n    def __init__(self,name,credential=None,write=False,base='https://ghcr.io'):\n        if not NAME.fullmatch(name):raise MetadataError('Invalid container repository name')\n        if base!='https://ghcr.io':raise MetadataError('Only the GHCR registry is supported')\n        self.name=name;self.base=base;self.credential=credential;self.write=write;self.token=None\n        self.opener=build_opener(NoRedirect)\n\n    def authenticate(self):\n        scope='repository:'+self.name+':pull'+(',push' if self.write else '')\n        headers={}\n        if self.credential:\n            headers['Authorization']='Basic '+base64.b64encode(('repo-reborn:'+self.credential).encode()).decode()\n        try:\n            with self.opener.open(Request(self.base+'/token?'+urlencode({'service':'ghcr.io','scope':scope}),headers=headers),timeout=60) as response:\n                value=json.loads(response.read(1024**2))\n            self.token=value.get('token') or value['access_token']\n        except (HTTPError,URLError,KeyError,ValueError) as error:\n            raise RegistryError(getattr(error,'code',0)) from None\n\n    def request(self,path,method='GET',data=None,headers=None,redirects=False):\n        if self.token is None:self.authenticate()\n        url=urljoin(self.base,path)\n        if urlsplit(url).scheme!='https' or urlsplit(url).netloc!='ghcr.io':\n            raise MetadataError('Registry upload location is outside GHCR')\n        for attempt in range(4):\n            outgoing={**(headers or {}),'Authorization':'Bearer '+self.token}\n            try:\n                return self.opener.open(Request(url,data=data,method=method,headers=outgoing),timeout=60)\n            except HTTPError as error:\n                if error.code==401 and attempt==0:\n                    error.close();self.authenticate();continue\n                if error.code in (301,302,303,307,308) and redirects and method in ('GET','HEAD'):\n                    target=urljoin(url,error.headers['Location']);error.close()\n                    parts=urlsplit(target)\n                    # Registry credentials must NEVER follow a blob redirect.\n                    if (parts.scheme!='https' or parts.username or parts.password or parts.port not in (None,443)\n                            or not (parts.hostname=='pkg-containers.githubusercontent.com'\n                                    or parts.hostname=='ghcr.io')):\n                        raise MetadataError('Container blob redirected outside supported GitHub storage')\n                    try:return self.opener.open(Request(target,method=method),timeout=60)\n                    except HTTPError as e:raise RegistryError(e.code) from None\n                code=error.code;error.close()\n                if code in (429,500,502,503,504) and attempt<3:time.sleep(2**attempt);continue\n                raise RegistryError(code) from None\n            except URLError:\n                if attempt<3:time.sleep(2**attempt);continue\n                raise RegistryError(0) from None\n\n    def endpoint(self,kind,ref=''):\n        return '/v2/'+self.name+'/'+kind+('/'+quote(ref,safe=':') if ref else '')\n\n    def manifest(self,ref):\n        if not DIGEST.fullmatch(ref) and not TAG.fullmatch(ref):raise MetadataError('Invalid container reference')\n        with self.request(self.endpoint('manifests',ref),headers={'Accept':', '.join(MANIFESTS)}) as response:\n            data=response.read(MAX_MANIFEST+1)\n            declared=response.headers.get('Docker-Content-Digest')\n        if len(data)>MAX_MANIFEST:raise MetadataError('Container manifest exceeds size limit')\n        actual=digest(data)\n        if (DIGEST.fullmatch(ref) and actual!=ref) or (declared and actual!=declared):\n            raise MetadataError('Container manifest digest mismatch')\n        return data\n\n    def tags(self):\n        path=self.endpoint('tags/list')+'?n=100';seen=set();result=[]\n        while path:\n            if path in seen:raise MetadataError('Container tag pagination loop')\n            seen.add(path)\n            with self.request(path) as response:\n                value=json.loads(response.read(MAX_MANIFEST));link=response.headers.get('Link','')\n            result.extend(value.get('tags') or [])\n            match=re.search(r'<([^>]+)>;\\s*rel=\"?next\"?',link)\n            path=urljoin(self.base+path,match[1]) if match else None\n        if any(not TAG.fullmatch(t) for t in result) or len(result)!=len(set(result)):\n            raise MetadataError('Invalid or duplicated container tag')\n        return sorted(result)\n\n    def download_blob(self,value,size,target):\n        checked_digest(value)\n        with storage.reservation(target,size) as lease:\n            try:\n                with self.request(self.endpoint('blobs',value),redirects=True) as response,Path(target).open('wb') as stream:\n                    Path(target).chmod(0o600);h=hashlib.sha256()\n                    while chunk:=response.read(storage.CHUNK):h.update(chunk);lease.write(stream,chunk)\n                if lease.written!=size or 'sha256:'+h.hexdigest()!=value:\n                    raise MetadataError('Container blob size/digest mismatch')\n            except BaseException:\n                Path(target).unlink(missing_ok=True);raise\n\n    def has_blob(self,value):\n        try:\n            with self.request(self.endpoint('blobs',checked_digest(value)),'HEAD',redirects=True):return True\n        except RegistryError as e:\n            if e.status==404:return False\n            raise\n\n    def upload_blob(self,value,path):\n        checked_digest(value)\n        if self.has_blob(value):return\n        with self.request(self.endpoint('blobs/uploads')+'/', 'POST',data=b'') as response:\n            location=response.headers['Location']\n        # Stream the body through http.client: no entire layers in memory and\n        # no credentials in external process arguments or Docker config files.\n        target=urljoin(self.base,location)\n        parts=urlsplit(target)\n        if parts.scheme!='https' or parts.netloc!='ghcr.io':raise MetadataError('Unsafe registry upload location')\n        target+=('&' if parts.query else '?')+urlencode({'digest':value})\n        parts=urlsplit(target);conn=http.client.HTTPSConnection(parts.netloc,timeout=120)\n        try:\n            with Path(path).open('rb') as stream:\n                conn.request('PUT',parts.path+'?'+parts.query,body=stream,headers={\n                    'Authorization':'Bearer '+self.token,'Content-Type':'application/octet-stream',\n                    'Content-Length':str(Path(path).stat().st_size)})\n                response=conn.getresponse();code=response.status;response.read(1024**2)\n            if code not in (201,202):raise RegistryError(code)\n        finally:conn.close()\n\n    def put_manifest(self,ref,data):\n        value=json.loads(data);media=value.get('mediaType')\n        if media not in MANIFESTS:raise MetadataError('Unsupported container manifest media type')\n        if not DIGEST.fullmatch(ref) and not TAG.fullmatch(ref):raise MetadataError('Invalid container reference')\n        with self.request(self.endpoint('manifests',ref),'PUT',data,{'Content-Type':media}) as response:\n            actual=response.headers.get('Docker-Content-Digest')\n            if actual and actual!=digest(data):raise MetadataError('Uploaded manifest digest mismatch')\n\n\ndef descriptors(data):\n    obj=json.loads(data)\n    if obj.get('schemaVersion')!=2 or obj.get('mediaType') not in MANIFESTS:\n        raise MetadataError('Unsupported container manifest schema/media type')\n    children=obj.get('manifests',[])\n    if obj.get('subject'):children=[*children,obj['subject']]\n    blobs=[*obj.get('layers',[]),*obj.get('blobs',[])]\n    if obj.get('config'):blobs.append(obj['config'])\n    for row in [*children,*blobs]:\n        checked_digest(row.get('digest'))\n        if not isinstance(row.get('size'),int) or row['size']<0 or row.get('urls'):\n            raise MetadataError('External or malformed container descriptor needs separate preservation')\n        if row.get('data'):\n            try:embedded=base64.b64decode(row['data'],validate=True)\n            except ValueError:raise MetadataError('Invalid embedded OCI data') from None\n            if len(embedded)!=row['size'] or digest(embedded)!=row['digest']:raise MetadataError('Embedded OCI data integrity failure')\n    return obj,children,blobs\n\n\ndef validate_file(root,value,size):\n    path=blob_path(root,value)\n    if path.is_symlink() or not path.is_file() or path.stat().st_size!=size:return False\n    h=hashlib.sha256()\n    with path.open('rb') as stream:\n        while chunk:=stream.read(storage.CHUNK):h.update(chunk)\n    return 'sha256:'+h.hexdigest()==value\n\n\ndef discover(registry,versions):\n    \"\"\"All REST versions seed traversal, including untagged multiarch/attestations.\"\"\"\n    pending={checked_digest(v['name']):None for v in versions};manifests={};blobs={};tags={};embedded={}\n    for version in versions:\n        for tag in version['metadata']['container']['tags']:\n            if not TAG.fullmatch(tag) or tag in tags:raise MetadataError('Invalid/ambiguous package tag')\n            tags[tag]=version['name']\n    with ThreadPoolExecutor(max_workers=4) as pool:\n        while pending:\n            batch=[pending.popitem() for _ in range(min(4,len(pending)))]\n            raws=list(pool.map(lambda item:embedded.get(item[0]) or registry.manifest(item[0]),batch))\n            for (value,size),raw in zip(batch,raws):\n                if value in manifests:continue\n                if digest(raw)!=value or (size is not None and len(raw)!=size):raise MetadataError('Container manifest integrity failure')\n                _,children,layers=descriptors(raw);manifests[value]=raw\n                for row in [*children,*layers]:\n                    if row.get('data'):embedded[row['digest']]=base64.b64decode(row['data'],validate=True)\n                if sum(map(len,manifests.values()))>256*1024**2:raise MetadataError('Container manifest graph exceeds supported metadata memory budget')\n                for row in children:\n                    key=row['digest']\n                    if key in manifests and len(manifests[key])!=row['size']:raise MetadataError('Inconsistent child manifest size')\n                    if key not in manifests:pending[key]=row['size']\n                for row in layers:\n                    if row['digest'] in blobs and blobs[row['digest']]!=row['size']:raise MetadataError('Inconsistent blob size')\n                    blobs[row['digest']]=row['size']\n    if registry.tags()!=sorted(tags):raise MetadataError('Registry tags differ from GitHub package version inventory')\n    # Ensure tags still point at the inventoried bytes before approving deletion.\n    with ThreadPoolExecutor(max_workers=4) as pool:\n        def check_tag(item):\n            tag,value=item\n            if digest(registry.manifest(tag))!=value:raise MetadataError('Container tag moved during backup')\n        list(pool.map(check_tag,tags.items()))\n    return manifests,blobs,tags,embedded\n\n\ndef restore(registry,root,entry):\n    for value,size in entry['blobs'].items():\n        if not validate_file(root,value,size):raise MetadataError('Container backup integrity failure')\n        registry.upload_blob(value,blob_path(root,value))\n    done=set();active=set()\n    def upload(value):\n        if value in done:return\n        if value in active:raise MetadataError('Container manifest dependency cycle')\n        active.add(value);raw=blob_path(root,value).read_bytes()\n        if digest(raw)!=value:raise MetadataError('Container manifest backup integrity failure')\n        _,children,_=descriptors(raw)\n        for row in children:upload(row['digest'])\n        registry.put_manifest(value,raw);done.add(value);active.remove(value)\n    for value in entry['manifests']:upload(value)\n    for tag,value in entry['tags'].items():\n        try:current=digest(registry.manifest(tag))\n        except RegistryError as e:\n            if e.status!=404:raise\n            current=None\n        if current not in (None,value):raise MetadataError('Refusing to overwrite a changed container tag')\n        if current is None:registry.put_manifest(tag,blob_path(root,value).read_bytes())\n\n\ndef verify(registry,entry,deep=False):\n    if registry.tags()!=sorted(entry['tags']):raise MetadataError('Restored container tag set differs')\n    for tag,value in entry['tags'].items():\n        if digest(registry.manifest(tag))!=value:raise MetadataError('Restored container tag digest differs')\n    embedded={}\n    for value in entry['manifests']:\n        raw=registry.manifest(value)\n        if digest(raw)!=value:raise MetadataError('Restored container manifest differs')\n        _,children,blobs=descriptors(raw)\n        for row in [*children,*blobs]:\n            if row.get('data'):embedded[row['digest']]=base64.b64decode(row['data'],validate=True)\n    for value,size in entry['blobs'].items():\n        if value in embedded:\n            if len(embedded[value])!=size:raise MetadataError('Embedded remote blob size differs')\n            continue\n        with registry.request(registry.endpoint('blobs',value),redirects=True) as response:\n            h=hashlib.sha256();total=0\n            while chunk:=response.read(storage.CHUNK):\n                total+=len(chunk)\n                if total>size:raise MetadataError('Remote container blob exceeds inventoried size')\n                h.update(chunk)\n            if total!=size or 'sha256:'+h.hexdigest()!=value:raise MetadataError('Remote container blob integrity failure')\n    return {'manifests':len(entry['manifests']),'tags':len(entry['tags']),'blobs':len(entry['blobs']),'sha256_verified':True}\n\nimport os,tempfile\nrepo=os.environ['FIXTURE_REPO'];name=repo.lower()+'/image'\nr=Registry(name,credential=os.environ['GH_TOKEN'],write=True)\nobjects={}\ndef blob(data):\n    value=digest(data)\n    with tempfile.TemporaryDirectory() as folder:\n        path=Path(folder)/'blob';path.write_bytes(data);r.upload_blob(value,path)\n    objects[value]=data\n    return {'digest':value,'size':len(data)}\nlayer=blob(b'Repo Reborn tiny synthetic layer\\n')\nmanifests=[]\nfor arch in ('amd64','arm64'):\n    config=blob(json.dumps({'architecture':arch,'os':'linux','rootfs':{'type':'layers','diff_ids':[]},\n        'config':{'Labels':{'org.opencontainers.image.source':'https://github.com/'+repo}}}).encode())\n    raw=json.dumps({'schemaVersion':2,'mediaType':MANIFESTS[1],\n        'config':{**config,'mediaType':'application/vnd.oci.image.config.v1+json'},\n        'layers':[{**layer,'mediaType':'application/vnd.oci.image.layer.v1.tar'}]}).encode()\n    value=digest(raw);r.put_manifest(value,raw)\n    manifests.append({'digest':value,'size':len(raw),'mediaType':MANIFESTS[1],'platform':{'architecture':arch,'os':'linux'}})\nindex=json.dumps({'schemaVersion':2,'mediaType':MANIFESTS[0],'manifests':manifests}).encode()\nr.put_manifest('v1',index);r.put_manifest('latest',index)\nattestation=json.dumps({'schemaVersion':2,'mediaType':MANIFESTS[1],\n    'config':{**config,'mediaType':'application/vnd.oci.image.config.v1+json'},'layers':[],\n    'subject':{'digest':digest(index),'size':len(index),'mediaType':MANIFESTS[0]},\n    'annotations':{'org.opencontainers.artifact.description':'Synthetic untagged attestation'}}).encode()\nr.put_manifest(digest(attestation),attestation)\nprint('Published synthetic multiarch package, two tags, untagged children and subject attachment.')\nPY\n"
        }
      ]
    }
  }
}